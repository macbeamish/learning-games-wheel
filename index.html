<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Games Wheel</title>
    <meta name="description" content="Spin a wheel to pick a home-learning game. Add your own games, save them in this browser, and download a CSV backup anytime." />
    <style>
      .pulse-slow {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.8;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }
    </style>
  </head>
  <body class="text-black bg-white dark:bg-gray-900 dark:text-white">
    <div id="root"></div>
    <script type="module" src="/src/App.tsx"></script>
  </body>
</html>
